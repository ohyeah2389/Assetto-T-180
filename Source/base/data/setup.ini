;MARK: STEER CONTROL


[CUSTOM_SCRIPT_ITEM_10592772]
ID=STEER_CONTROLLER_MODEL
SHOW_CLICKS=0
TAB=STEER 0 SETTINGS
NAME=Steering Controller Model
LUT=steer_ctrlr_models.lut
DEFAULT=1
POS_X=0.5
POS_Y=0
HELP="Changes the selected steering control computer model.\nClassic is the algorithm present since the early versions of the project.\nModern is a newer, easier algorithm added in v0.13.0 that requires smoother input and provides higher drift angles during cornering.\nActive is a port of roun12's custom steering controller from his T-180 Active project, including its enhanced gamepad support."

[CUSTOM_SCRIPT_ITEM_35717868]
ID=STEERING_RANGE
SHOW_CLICKS=0
TAB=STEER 0 SETTINGS
NAME=Steering Range
LUT=steering_mult_options.lut
DEFAULT=3
POS_X=0.5
POS_Y=1
HELP="Changes the range of the steering wheel. Higher values give the steering wheel more travel and make it less sensitive. Lower values give the steering wheel less travel and make it more sensitive.\nController players may want to set this to 180, or lower depending on the speed sensitivity currently configured."

; V1 only

[CUSTOM_SCRIPT_ITEM_28281513]
ID=YAW_RATE_POWER
SHOW_CLICKS=0
TAB=STEER 1 CLASSIC
NAME=Yaw Rate Power
MIN=0
MAX=20
STEP=1
DEFAULT=6
POS_X=0.5
POS_Y=2
HELP="Affects Classic controller model only.\nControls how aggressively the yaw rate PID controller responds to target yaw rate changes. Higher values will make the car more responsive but can cause limit cycle oscillations. Lower values will make the car less responsive but too low of a value can cause the car to feel sluggish and delayed."

[CUSTOM_SCRIPT_ITEM_5084963]
ID=SERVO_POWER
SHOW_CLICKS=0
TAB=STEER 1 CLASSIC
NAME=Servo Power
MIN=0
MAX=30
STEP=1
DEFAULT=9
POS_X=0.5
POS_Y=3
HELP="Affects Classic controller model only.\nMaster power multiplier for all wheel servos. Affects how strongly each wheel servo responds to angle command inputs from the steering controller.\n\nHigher values make the wheel servos delfect farther to match their commanded angle inputs, but too high of a value can make them overshoot and oscillate."

[CUSTOM_SCRIPT_ITEM_61944453]
ID=SERVO_DAMPING
SHOW_CLICKS=0
TAB=STEER 1 CLASSIC
NAME=Servo Damping
MIN=0
MAX=30
STEP=1
DEFAULT=12
POS_X=0.5
POS_Y=4
HELP="Affects Classic controller model only.\nSmooths out the wheel servo response. Lower values give smoother but slower corrections. Higher values give sharper but potentially twitchy responses.\n\nToo low of a value can cause limit cycle oscillations especially under high vertical G loads. Too high of a value can cause the wheel servos to jitter."

[CUSTOM_SCRIPT_ITEM_21196259]
ID=SERVO_LIMIT
SHOW_CLICKS=0
TAB=STEER 1 CLASSIC
NAME=Servo Limit
LUT=setup_servo_limit.lut
DEFAULT=2
POS_X=0.5
POS_Y=4
HELP="Affects Classic controller model only.\nLimits the travel range of the steering servos. Setting this to 360 or lower can help prevent wheels becoming stuck facing backwards at speed."

[CUSTOM_SCRIPT_ITEM_79937994] 
ID=INVERSION_ASSIST
SHOW_CLICKS=0
TAB=STEER 1 CLASSIC
NAME=Inversion Assist
LUT=setup_true_false.lut
DEFAULT=1
POS_X=0.5
POS_Y=5
HELP="Affects Classic controller model only.\nAttempts to detect when a spin is occuring and tries to stabilize the spin by taking alternative control of the servos. Disabling this can help prevent wheels becoming stuck facing backwards at speed."

